[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeguard-zones"
version = "0.1.0"
description = "StoreGuard zone geometry and overlay: polygon ROIs, point-in-polygon, YAML loading (Phase 2)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6,<7"]

[project.optional-dependencies]
# Overlay rendering uses OpenCV; part of the shared `ml` story.
ml = ["opencv-python>=4.9,<5"]

[project.scripts]
storeguard-zones = "storeguard_zones.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
