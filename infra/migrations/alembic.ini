# Alembic config for StoreGuard. Used from later phases; the initial migration
# mirrors the SQLAlchemy models so the schema is reviewable now.
[alembic]
script_location = %(here)s
prepend_sys_path = ../../apps/api/src
# Overridden at runtime by STOREGUARD_DATABASE_URL in env.py.
sqlalchemy.url = postgresql+psycopg://storeguard:storeguard@localhost:5432/storeguard

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
