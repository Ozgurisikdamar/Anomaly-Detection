[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeguard-integrations"
version = "0.1.0"
description = "StoreGuard integration adapters. Phase 0 ships SIMULATED POS/scanner/scale generators only."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
