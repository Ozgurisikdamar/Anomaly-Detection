[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeguard-vision"
version = "0.1.0"
description = "StoreGuard vision benchmark scaffold. Phase 0 ships methodology + a harness STUB only (no model execution)."
requires-python = ">=3.11"
# Heavy ML deps (ultralytics, opencv, onnxruntime, openvino) are intentionally
# NOT declared in Phase 0 — no model is run and nothing is downloaded. They are
# added in Phase 1 behind the documented benchmark harness.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
