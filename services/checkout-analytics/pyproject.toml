[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeguard-checkout-analytics"
version = "0.1.0"
description = "StoreGuard self-checkout analytics: terminal state machine + scan/scale reconciliation (Phase 4)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
storeguard-checkout = "storeguard_checkout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
