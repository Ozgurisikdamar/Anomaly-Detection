# StoreGuard demo — Docker Compose (Phase 0).
#
# The API runs from in-memory SIMULATED data and does not require Postgres in
# Phase 0; the `postgres` service is included for later phases (PostgreSQL +
# Alembic). No Kubernetes/Kafka — a single-host modular monolith by design.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storeguard}
      POSTGRES_DB: ${POSTGRES_DB:-storeguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      STOREGUARD_USE_IN_MEMORY_SEED: "true"
      STOREGUARD_DATABASE_URL: postgresql+psycopg://storeguard:storeguard@postgres:5432/storeguard
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
