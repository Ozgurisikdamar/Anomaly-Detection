[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storeguard-contracts"
version = "0.1.0"
description = "StoreGuard shared data contracts (core entities, event contract). Source of truth for the TypeScript mirror."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
